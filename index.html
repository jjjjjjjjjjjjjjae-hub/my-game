<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест</title>
    <style>
        body { 
            background-color: #111; 
            color: #0f0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            font-family: monospace;
        }
        .box {
            border: 2px solid #0f0;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>САЙТ ЖҰМЫС ІСТЕП ТҰР!</h1>
        <p>Пайдаланушы: jjjjjjjjjjjjjjae-hub</p>
        <p id="time"></p>
    </div>

    <script>
        // Скрипт жұмыс істеп тұрғанын тексеру
        document.getElementById('time').innerText = "Қазіргі уақыт: " + new Date().toLocaleTimeString();
        console.log("Сайт сәтті ашылды!");
    </script>
</body>
</html>
